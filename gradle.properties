org.gradle.jvmargs=-Xmx2048m \
--add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED \
--add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED \
--add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED
android.useAndroidX=true
org.gradle.daemon=true
org.gradle.configureondemand=true
android.enableJetifier=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false
# AGP 9 enables built-in Kotlin compilation by default, which conflicts with this project's
# explicit 'kotlin-android' plugin application. The app module has zero .kt sources (only the
# vendored renderscript-toolkit module does, and it applies its own kotlin-android plugin), so
# there's nothing to gain from migrating to built-in Kotlin right now - opt out to keep this
# AGP jump scoped to what's necessary.
android.builtInKotlin=false
# The 'kotlin-android' plugin is incompatible with AGP 9's new DSL (android.newDsl=true default)
# unless also using built-in Kotlin - since we're opting out of built-in Kotlin above, opt out of
# the new DSL too (AGP's own documented temporary bypass for this exact combination). This will
# need to be revisited before AGP 10.0, which removes the opt-out.
android.newDsl=false